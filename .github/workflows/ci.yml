name: ci

# Plain lint + test CI. Data files under /data/ and pipeline artefacts
# under /outputs/ are version-controlled (all sources are public Crown
# Copyright under OGL v3.0; see data/DATA_DICTIONARY.md). The previous
# no-data-leak workflow that blocked them has been removed.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project (dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Black formatting
        run: black --check .

      - name: Pytest
        env:
          PYTHONPATH: src
        run: pytest -q --no-cov
