name: no-data-leak

# Belt-and-braces check that no data is accidentally committed. The
# .gitignore policy is the first line of defence; this workflow is the
# second, catching anything that slipped past (e.g. `git add -f`).
#
# Failure modes covered:
#   1. Any tracked file under /data/ except data/DATA_DICTIONARY.md.
#   2. Any tracked file whose extension matches a known data format.
#   3. Any Jupyter notebook carrying execution outputs, execution counts,
#      cell attachments, or widget state — all of which can embed data
#      pulled from the analytical environment.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq

      - name: Block files under /data/ (except DATA_DICTIONARY.md)
        shell: bash
        run: |
          set -euo pipefail
          violations=$(git ls-files 'data/' | grep -v '^data/DATA_DICTIONARY\.md$' || true)
          if [ -n "$violations" ]; then
            echo "::error::Files under /data/ may not be committed. Only data/DATA_DICTIONARY.md is permitted."
            while IFS= read -r f; do echo "::error file=$f::Forbidden file under /data/"; done <<<"$violations"
            exit 1
          fi
          echo "OK — only DATA_DICTIONARY.md is tracked under /data/."

      - name: Block tracked files with data file extensions
        shell: bash
        run: |
          set -euo pipefail
          # Tabular, statistical, binary, compressed, and document formats
          # that commonly carry data. Patterns are case-insensitive.
          BLOCKED='\.(csv|tsv|psv|xls|xlsx|xlsm|xlsb|ods|parquet|feather|arrow|orc|avro|sav|dta|sas7bdat|rdata|rds|pkl|pickle|joblib|npz|npy|mat|h5|hdf5|nc|db|sqlite|sqlite3|pdf|gz|bz2|xz|zst|zip|tar|7z|rar)$'
          violations=$(git ls-files | grep -Ei "$BLOCKED" || true)
          if [ -n "$violations" ]; then
            echo "::error::Tracked files with data-bearing extensions detected. Move them under /data/ (gitignored) or rewrite history."
            while IFS= read -r f; do echo "::error file=$f::Blocked extension"; done <<<"$violations"
            exit 1
          fi
          echo "OK — no tracked files match blocked extensions."

      - name: Block Jupyter notebooks carrying outputs or embedded data
        shell: bash
        run: |
          set -euo pipefail
          notebooks=$(git ls-files '*.ipynb' || true)
          if [ -z "$notebooks" ]; then
            echo "No notebooks tracked."
            exit 0
          fi
          fail=0
          while IFS= read -r nb; do
            [ -f "$nb" ] || continue
            # A clean notebook has: no cell outputs, no execution_count,
            # no cell attachments, no notebook-level widget state.
            outputs=$(jq '[.cells[]? | select(.outputs!=null) | .outputs | length] | add // 0' "$nb")
            execs=$(jq '[.cells[]? | select(.execution_count!=null)] | length' "$nb")
            attach=$(jq '[.cells[]? | select(.attachments!=null)] | length' "$nb")
            widgets=$(jq '.metadata.widgets // empty | length // 0' "$nb")
            if [ "${outputs:-0}" -gt 0 ] || [ "${execs:-0}" -gt 0 ] || [ "${attach:-0}" -gt 0 ] || [ "${widgets:-0}" -gt 0 ]; then
              echo "::error file=$nb::Notebook carries outputs / execution_count / attachments / widget state — strip with nbstripout before committing."
              fail=1
            fi
          done <<<"$notebooks"
          if [ "$fail" -ne 0 ]; then
            echo "::error::One or more notebooks would leak data. Install the project's pre-commit hooks (pre-commit install) to auto-strip on commit."
            exit 1
          fi
          echo "OK — all notebooks are clean."
