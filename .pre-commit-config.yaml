# Pre-commit hooks for PWR workforce elasticity modelling.
#
# Focused on code quality. Data files under /data/ and pipeline outputs
# under /outputs/ are version-controlled (public Crown-Copyright sources
# under OGL v3.0; see data/DATA_DICTIONARY.md). The previous data-leak
# and nbstripout hooks have been removed so the source artefacts stay
# committed.
#
# Install once with `pre-commit install` after cloning the repository.
# `pytest` is wired as a pre-push hook so commits stay fast while pushes
# remain gated.

default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(data/|outputs/|notebooks/)
      - id: end-of-file-fixer
        exclude: ^(data/|outputs/|notebooks/)
      - id: check-merge-conflict
      - id: check-yaml
        exclude: ^(data/|outputs/)
      - id: check-toml
      - id: check-json
        exclude: ^(notebooks/|outputs/)
      - id: check-case-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black

  - repo: local
    hooks:
      - id: pytest
        name: pytest (pre-push)
        description: Run the test suite before pushing.
        entry: pytest -q --no-header --quiet
        language: system
        pass_filenames: false
        stages: [pre-push]
        types: [python]
