# Pre-commit hooks for PWR workforce elasticity modelling.
#
# Purpose: prevent any data, notebook output, or large binary from entering
# the commit graph, and enforce code quality on Python sources before the
# CI runs.
#
# Install once with `pre-commit install` after cloning the repository.
# `pytest` is wired as a pre-push hook so commits stay fast while pushes
# remain gated.

default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-case-conflict
      - id: check-added-large-files
        args: ["--maxkb=512"]

  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout
        # Strip everything that could carry data: cell outputs, execution
        # counts, cell metadata, kernel info, and widget state.
        args:
          - --drop-empty-cells
          - --strip-init-cells

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black

  - repo: local
    hooks:
      - id: no-data-files
        name: block data files and /data/ paths
        description: Refuse to stage data-bearing extensions or anything under /data/ except DATA_DICTIONARY.md.
        entry: scripts/check_no_data_files.sh
        language: script
        pass_filenames: true
        types: [file]

      - id: pytest
        name: pytest (pre-push)
        description: Run the test suite before pushing.
        entry: pytest -q --no-header --quiet
        language: system
        pass_filenames: false
        stages: [pre-push]
        types: [python]
