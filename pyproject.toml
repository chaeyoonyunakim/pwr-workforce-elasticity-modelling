[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "pwr-workforce-elasticity-modelling"
version = "0.1.0"
description = "Elasticity of NHS provider bank pay expenditure with respect to agency-restriction policy."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Chaeyoon Kim" },
]
keywords = ["nhs", "workforce", "elasticity", "panel-data", "pwr"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15.0",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pyjanitor>=0.27",
    "statsmodels>=0.14",
    "linearmodels>=6.0",
    "scikit-learn>=1.4",
    "shap>=0.45",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "plotly>=5.20",
    "jupyterlab>=4.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "black>=24.0",
    "pre-commit>=3.7",
    "nbstripout>=0.7",
]

[project.urls]
Repository = "https://github.com/chaeyoonyunakim/pwr-workforce-elasticity-modelling"

[project.scripts]
pwr-pipeline = "pwr_elasticity.pipeline:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pwr_elasticity"]

[tool.hatch.build.targets.sdist]
include = [
    "src/pwr_elasticity",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks", "data", "outputs"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "PD",  # pandas-vet
    "PL",  # pylint subset
    "RUF", # ruff-specific
]
ignore = [
    "PLR0913",  # too many arguments — acceptable for estimator signatures
    "PLR2004",  # magic value comparison — common in test assertions
    "RUF001",   # ambiguous unicode in identifiers — N/A here
    "RUF002",   # ambiguous unicode in docstrings — we use β, α, ×, – etc. intentionally
    "RUF003",   # ambiguous unicode in comments — same justification as RUF002
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "S101"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = '''
/(
    notebooks
  | data
  | outputs
)/
'''

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pkg_resources",
]

[tool.coverage.run]
source = ["src/pwr_elasticity"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 0  # raised in T2 once io.py has real implementations
